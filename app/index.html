<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="referrer" content="origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZIMPLES</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZIMPLES">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concepto: neón nocturno. Fondo casi negro, la Z en verde lima eléctrico, coral para lo que sale. Un solo gesto por pantalla; el teclado numérico propio reemplaza al del teléfono; los colores de moneda son los de las columnas de la planilla. */
:root{
  color-scheme:dark;
  --bg:#0a0a0b; --surface:#131316; --ink:#f4f4f0; --muted:#8c8c94; --line:#26262b;
  --accent:#c6ff3d; --accent-glow:rgba(198,255,61,.28); --coral-glow:rgba(255,92,122,.26);
  --out-bg:#ff5c7a; --out-fg:#1a0a0e; --in-bg:#c6ff3d; --in-fg:#0c1500;
  --usd:#c6ff3d; --ars:#5cc8ff; --eur:#ffd23f;
  --key:#1b1b20; --key-press:#2a2a31; --ok:#c6ff3d; --warn:#ffb84d;
  --f-ui:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --f-num:'DM Mono',ui-monospace,Menlo,monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.page{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.note b{font-family:var(--f-num);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:640px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.brand{font-family:var(--f-num);font-weight:500;font-size:12px;letter-spacing:.14em}
.mes{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.screen{flex:1;display:flex;flex-direction:column;gap:12px;padding:6px 16px 16px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--key);padding:5px;border-radius:14px}
.seg button{height:46px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 14px var(--f-ui);letter-spacing:.06em;cursor:pointer}
.seg button[aria-pressed="true"].out{background:var(--out-bg);color:var(--out-fg)}
.seg button[aria-pressed="true"].in{background:var(--in-bg);color:var(--in-fg)}
.cur{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--f-num);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--key)}
.amount{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;padding:10px 4px 2px;min-height:78px}
.amount .code{font:500 15px var(--f-num);color:var(--muted)}
.amount .num{font:500 52px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:right}
.amount .num.empty{color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border:0;border-radius:14px;background:var(--key);color:var(--ink);font:500 24px var(--f-num);cursor:pointer}
.pad button:active{background:var(--key-press)}
.det{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:400 15px var(--f-ui)}
.det::placeholder{color:var(--muted)}
.save{height:58px;border:0;border-radius:16px;font:700 16px var(--f-ui);letter-spacing:.08em;cursor:pointer;transition:opacity .15s}
.save.out{background:var(--out-bg);color:var(--out-fg)}
.save.in{background:var(--in-bg);color:var(--in-fg)}
.save:disabled{opacity:.35;cursor:not-allowed}
.where{font-size:12px;color:var(--muted);text-align:center;font-family:var(--f-num)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{height:56px;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-ui);letter-spacing:.03em;cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}
.toast{position:sticky;bottom:12px;margin:0 16px 12px;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.toast button{border:0;background:transparent;color:inherit;font:700 13px var(--f-ui);letter-spacing:.06em;text-decoration:underline;cursor:pointer}
.swap{display:grid;grid-template-columns:1fr;gap:10px}
.box{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.box[data-on="1"]{border-color:var(--ink)}
.box h3{margin:0;font:600 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.box .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.box .num{font:500 30px/1.1 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.box .num.empty{color:var(--line)}
.arrow{text-align:center;color:var(--muted);font:500 18px var(--f-num)}
.hint{font-size:12.5px;color:var(--muted)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tot div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tot small{display:block;color:var(--muted);font:500 11px var(--f-num);letter-spacing:.06em}
.tot b{font:500 19px var(--f-num);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list .d{font:400 12px var(--f-num);color:var(--muted)}
.list .t{min-width:0;overflow-wrap:anywhere}
.list .t small{display:block;color:var(--muted);font-size:12px}
.list .m{font:500 15px var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.list .m.o{color:var(--ink)} .list .m.i{color:var(--ok)}
.how{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.how h2{font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--ink)}
.how ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.list li[data-i]{cursor:pointer}
.list li[data-i]:hover .t{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cards div{border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;min-width:0}
.cards small{display:block;color:var(--muted);font:500 10px var(--f-num);letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.cards b{display:block;font:500 22px/1.2 var(--f-num);font-variant-numeric:tabular-nums;margin-top:4px}
.cards b.pos{color:var(--ok)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h2{margin:0;font:600 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.sec p{margin:0;font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:9.5px;fill:var(--muted)}
.chart .lb{fill:var(--ink)}
.chart .gl{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--key)}
.stack i{display:block;height:100%}
.insight{border-left:3px solid var(--ink);padding:6px 12px;font-size:14px}
.ctas{gap:8px}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer}
.cta b{font:600 14px var(--f-ui)} .cta span{font:400 12.5px var(--f-num);color:var(--muted);overflow-wrap:anywhere}
.dif{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:4px 10px}
.dif.ok{border-color:var(--ok);color:var(--ink)}
.aviso2{border:1.5px solid var(--out-bg);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.det.up{text-transform:uppercase}
.ml .pt{display:block;width:10px;height:10px;border-radius:50%}
.ml li{grid-template-columns:24px 1fr auto}
.ml .m{font:500 11px var(--f-num);color:var(--muted);letter-spacing:.06em}
.ed{display:flex;flex-direction:column;gap:12px}
.ed h2{margin:0;font:600 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.ed .num-in{height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:500 28px var(--f-num);text-align:right;width:100%}
.ed .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--f-ui);letter-spacing:.06em;cursor:pointer}
.ghost.del{color:var(--warn)}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--c4:#b28cff;--c5:#ff8a5c;--c6:#ff7ad9;--c7:#5cffd0}
.app{min-height:calc(100vh - 40px)}
.vacio{padding:28px 8px;text-align:center;color:var(--muted)}
.vacio button{margin-top:14px}

.top{gap:10px}
.top .mes{margin-left:auto}
#gear{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer;border-radius:10px}
#gear:focus-visible{outline:2px solid var(--ink)}
.sinTabs .tabs{display:none}
.lab{font-size:12.5px;color:var(--muted);margin-bottom:-6px}
.bienvenida{display:flex;flex-direction:column;gap:14px;padding:26px 4px 8px}
.bienvenida h2{margin:0;font:800 28px/1.1 var(--f-ui);letter-spacing:-.02em}
.bienvenida p{margin:0;color:var(--muted)}
.bienvenida .aviso{color:var(--warn);font-weight:600}
.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none}

/* --- Neón nocturno: acentos --- */
body{background-image:radial-gradient(120% 60% at 50% -10%,rgba(198,255,61,.09),transparent 60%);background-attachment:fixed}
.brand{font-family:var(--f-ui);font-weight:700;letter-spacing:.12em;font-size:13px}
.brand b{color:var(--accent);font-weight:700;font-size:17px;letter-spacing:0;margin-right:1px;text-shadow:0 0 14px var(--accent-glow)}
.save.in{box-shadow:0 0 26px var(--accent-glow)}
.save.out{box-shadow:0 0 26px var(--coral-glow)}
.save:disabled{box-shadow:none}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.box[data-on="1"]{border-color:var(--accent)}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.insight{border-left-color:var(--accent)}
.toast{background:var(--accent);color:#0c1500}
.toast button{color:#0c1500}
.bienvenida h2{color:var(--ink)}
.amount .num{text-shadow:0 0 22px rgba(244,244,240,.08)}
button:focus-visible,input:focus-visible,li:focus-visible{outline-color:var(--accent)}
.list .m.i{color:var(--accent)}
.list .m.o{color:var(--out-bg)}

/* --- Márgenes y alto (v1.3): respiro arriba y abajo, y todo el alto del celular sin scroll de más --- */
body{padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.app{min-height:calc(100vh - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.app{min-height:calc(100dvh - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.top{padding-top:16px}
.tabs{padding-bottom:0}
.screen{gap:clamp(8px,1.5dvh,12px)}
.seg button{height:clamp(40px,5.6dvh,46px)}
.amount{min-height:clamp(52px,8dvh,78px);padding-top:6px}
.amount .num{font-size:clamp(38px,6.4dvh,52px)}
.pad button{height:clamp(44px,6.6dvh,56px)}
.save{height:clamp(48px,6.8dvh,58px)}

/* --- v1.4: franja de avisos arriba y colchón abajo --- */
body{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.avisos{min-height:54px;display:flex;align-items:flex-end}
.avisos:empty::before{content:"";display:block}
.avisos .toast{position:static;margin:0;width:100%}
.avisos .toast.err{background:var(--out-bg);color:var(--out-fg)}
.avisos .toast.err button{color:var(--out-fg)}
.app,.app{min-height:calc(100vh - 132px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.app{min-height:calc(100dvh - 132px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.page{padding-bottom:30vh;padding-bottom:30dvh}
/* v1.5 · pantalla fija: solo vertical */
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
body{touch-action:pan-y}
.app,.page{max-width:100%;overflow-x:clip}
input,textarea{touch-action:manipulation}
/* v1.7 · monedas en una sola fila y formato celular también en la computadora */
.cur{flex-wrap:nowrap;gap:6px}
.cur.extra{flex-wrap:wrap}
.cur .chip{flex:1 1 0;min-width:0;justify-content:center;padding:0 6px;gap:6px;height:clamp(34px,4.8dvh,40px);font-size:13px;white-space:nowrap}
.cur.extra .chip{flex:0 0 auto;padding:0 14px}
.chip.mas{flex:0 0 auto;color:var(--muted);padding:0 10px}
.screen{padding-bottom:12px}
.where{font-size:11px}
@media (min-width:600px){
  html,body{background:#000}
  body{background-image:none}
  .page{width:420px;max-width:420px}
  .app{box-shadow:0 0 0 1px var(--line),0 0 60px rgba(198,255,61,.06)}
}
/* v1.6 · menú arriba */
.tabs{border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{border-top:0;margin-top:0;border-bottom:2px solid transparent;margin-bottom:-1px;height:48px}
.tabs button[aria-selected="true"]{border-top-color:transparent;border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div class="page">
  <div id="toastHost" class="avisos" aria-live="polite"></div>
  <div class="app" id="app">
    <div class="top"><span class="brand"><b>Z</b>IMPLES</span><span class="mes" id="mesTop"></span><button id="gear" type="button" aria-label="Ajustes" hidden>&#9881;&#xFE0E;</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="anotar" aria-selected="true">ANOTAR</button>
      <button role="tab" data-tab="cambio" aria-selected="false">CAMBIO</button>
      <button role="tab" data-tab="mes" aria-selected="false">MI MES</button>
      <button role="tab" data-tab="analisis" aria-selected="false">ANÁLISIS</button>
    </div>
    <div class="screen" id="screen"></div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
